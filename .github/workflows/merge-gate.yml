name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# windows-latest: clipper is a Windows app whose suite exercises
# Windows-only subprocess behaviour (STARTUPINFO / SW_HIDE via app_support), and
# its Qt widget tests need a headless platform, so QT_QPA_PLATFORM=offscreen.
#
# app_support and shared_ui are sibling packages, not published on PyPI, so they
# install from their public GitHub repos. The editable install of clipper MUST
# use compat mode or the "clipper" repo dir shadows the package as a namespace on
# sys.path (see tests/conftest.py).
#
# RIFE is fetched here rather than tracked, and --require makes a fetch that does
# not end in a runnable binary a red gate. This runner is the only place in the
# family the interpolator can execute -- it is a Windows PE, and the four tests
# that drive the seam bridge skip everywhere else -- so if it were merely allowed
# to skip here, clipper's default loop-fix pipeline would have no coverage at all.
# The release zip is 432 MB, so the extracted 17 MB is cached on the release tag.
#
# shell: bash gives every run step `set -eo pipefail`; the default Windows shell
# (pwsh) only checks the last line's exit code, so a failed sibling/pip install
# would pass silently and surface later as a confusing collection error.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    # About three times a green run, so it can only fire on a hang. A green job
    # is ~66 s of checkout and install plus two ~11 s suite legs, so ~88 s.
    # Without this, the queue's required check would sit on a hung run until
    # GitHub's six-hour default and print nothing that named it.
    timeout-minutes: 5
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install \
            "app_support @ git+https://github.com/haglio/app_support.git" \
            "shared_ui @ git+https://github.com/haglio/shared_ui.git"
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Cache the RIFE interpolator
        uses: actions/cache@v4
        with:
          path: tools/rife-ncnn-vulkan-20221029-windows
          key: rife-20221029-${{ runner.os }}
      - name: Fetch RIFE, and refuse to run without it
        shell: bash
        run: python tools/fetch_rife.py --require
      - name: Run the suite
        shell: bash
        run: python -m pytest -q
      # Again, back to front. Twelve modules used to carry their own QApplication
      # and one test reloaded a module session-wide -- the shapes that make a
      # result depend on what ran first. Reversing inverts every "this runs before
      # that" the suite has, so the next such lean goes red on the commit that
      # introduces it. TEST_COLLECTION_ORDER=shuffle with TEST_COLLECTION_SEED is
      # the deeper local check (see tests/conftest.py); the gate takes the
      # deterministic one.
      - name: Run the suite back to front
        shell: bash
        env:
          TEST_COLLECTION_ORDER: reverse
        run: python -m pytest -q
