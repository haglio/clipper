name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# windows-latest: clipper is a Windows Pygame/Qt app whose suite exercises
# Windows-only subprocess behaviour (STARTUPINFO / SW_HIDE via app_support), and
# its Qt widget tests need a headless platform, so QT_QPA_PLATFORM=offscreen.
#
# Sibling packages are not on PyPI and are handled per their layout:
#   - app_support ships a real package dir, so it builds a wheel cleanly from its
#     public repo -- pip install it.
#   - shared_ui is a flat-layout package (its modules live at the repo ROOT, so a
#     wheel build finds nothing and installs empty). It is consumed the way it is
#     locally: check the repo out and put its PARENT dir on PYTHONPATH, so
#     `import shared_ui` resolves to the checkout.
# The editable install of clipper MUST use compat mode or the "clipper" repo dir
# shadows the package as a namespace on sys.path (see tests/conftest.py).
#
# shell: bash gives every run step `set -eo pipefail`; the default Windows shell
# (pwsh) only checks the last line's exit code, so a failed sibling/pip install
# would pass silently and surface later as a confusing collection error.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared_ui (flat-layout sibling, imported off PYTHONPATH)
        uses: actions/checkout@v4
        with:
          repository: haglio/shared_ui
          path: _sibling/shared_ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "app_support @ git+https://github.com/haglio/app_support.git"
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/_sibling
        run: python -m pytest -q
