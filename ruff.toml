    # This repo's ratchet: what the family config found here, to be worked off rule by rule.
    "PLR2004", "PLC0415", "RUF046", "PT006", "PLR0913", "PLW1510", "SIM117", "PT018", "PLR0917", "RET504", "PERF401", "PLR0915", "B905", "C408", "UP022", "PLR0911", "SIM105", "PLR0912", "E402"]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLR2004", "PLC0415", "RUF046", "PT006", "PLR0913", "PLW1510", "SIM117", "PT018", "PLR0917", "RET504", "PERF401", "PLR0915", "B905", "C408", "UP022", "PLR0911", "SIM105", "PLR0912", "E402"]

[format]
quote-style = "double"
