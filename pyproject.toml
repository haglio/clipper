[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.10"
# app_support is NOT listed here: it is installed editable from ../app_support
# (see its README) and is not published, so pip would go looking for it on PyPI.
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "PyQt6",
    "qtawesome",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "vulture"]

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~4.1 s, so 60 s clears it fourteen times over and
# can only bite on a hang. The thread method prints the hung stack, which is what
# turns a stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds both halves of it.
addopts = "--timeout=60 --timeout-method=thread"
testpaths = ["tests"]
