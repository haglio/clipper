[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.10"
# app_support is NOT listed here: it is installed editable from ../app_support
# (see its README) and is not published, so pip would go looking for it on PyPI.
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "PyQt6",
    "qtawesome",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "vulture"]

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is the collection-order probe, which spawns a pytest child, at
# about a third of a second. --timeout-method=thread is the half that pays for
# itself: it dumps the hung stack, which turns a stalled required check into a
# one-line diagnosis. tests/test_timeouts.py holds all three halves of it.
addopts = "--timeout=60 --timeout-method=thread"
testpaths = ["tests"]
