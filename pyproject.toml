[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.10"
# app_support is NOT listed here: it is installed editable from ../app_support
# (see its README) and is not published, so pip would go looking for it on PyPI.
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "PyQt6",
    "qtawesome",
]

[project.optional-dependencies]
dev = ["pytest", "vulture"]

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
