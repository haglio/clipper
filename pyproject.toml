[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.10"
# app_support and shared_ui are NOT listed here: they are installed from the
# sibling checkouts (see app_support's README) and are not published, so pip
# would go looking for them on PyPI. CI installs both from GitHub explicitly.
dependencies = [
    "numpy",
    "opencv-python",
    "PyQt6",
]

[project.optional-dependencies]
dev = ["pytest", "vulture"]

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
